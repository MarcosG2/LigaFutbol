# Infra MySQL local (desarrollo). Para API + MySQL en producción usar backend/docker-compose.yml
services:
  mysql:
    image: mysql:8.0
    container_name: mysql_liga_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: liga_futbol
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
